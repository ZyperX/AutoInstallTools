name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: Lint
        run: make lint
      - name: Catalog, resolver, bats, README and link checks
        run: make test

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Lint the Windows companion
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error,Warning -EnableExit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-22.04, image: ubuntu:22.04, profile: web }
          - { distro: ubuntu-22.04, image: ubuntu:22.04, profile: mobile }
          - { distro: ubuntu-24.04, image: ubuntu:24.04, profile: web }
          - { distro: ubuntu-24.04, image: ubuntu:24.04, profile: mobile }
          - { distro: debian-12, image: debian:12, profile: web }
          - { distro: debian-12, image: debian:12, profile: mobile }
          - { distro: kali-rolling, image: kalilinux/kali-rolling, profile: web }
          - { distro: kali-rolling, image: kalilinux/kali-rolling, profile: mobile }
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Base packages
        run: |
          apt-get update
          apt-get install -y sudo curl jq git ca-certificates unzip xz-utils
      - name: Install profile (device steps are not part of these profiles)
        shell: bash
        run: |
          set -Eeuo pipefail
          profile='${{ matrix.profile }}'
          ./ait install --profile "$profile" --yes --no-shell 2>&1 | tee install.log
          printf 'distro=%s\nimage=%s\nprofile=%s\n' '${{ matrix.distro }}' '${{ matrix.image }}' "$profile" > install-metadata.txt
      - name: Capture install summary
        if: always()
        shell: bash
        run: |
          if [[ -f install.log ]]; then
            grep -A100 'The following tools could not be installed:' install.log > failures.txt || echo 'No failure summary emitted.' > failures.txt
          else
            echo 'Installer did not start.' > failures.txt
          fi
      - name: Upload failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.distro }}-${{ matrix.profile }}
          path: |
            failures.txt
            install.log
            install-metadata.txt
          if-no-files-found: ignore
