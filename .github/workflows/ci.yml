name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: Lint
        run: make lint
      - name: Catalog, resolver, checksum, manifest & dry-run
        run: make test

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Lint the Windows companion
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error,Warning -EnableExit

  integration:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, web]
    steps:
      - uses: actions/checkout@v4
      - name: Base packages
        run: |
          apt-get update
          apt-get install -y sudo curl jq git ca-certificates unzip
      - name: Install profile (device/GUI steps allowed to fail)
        shell: bash
        run: |
          set -o pipefail
          ./ait install --profile ${{ matrix.profile }} --yes 2>&1 | tee install.log || true
          # Surface any recorded failures as a summary artifact, but don't fail
          # the job on GUI-only / device-only tools.
          grep -i 'could not be installed' -A50 install.log > failures.txt || echo "none" > failures.txt
      - name: Upload failure summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-failures-${{ matrix.profile }}
          path: failures.txt
