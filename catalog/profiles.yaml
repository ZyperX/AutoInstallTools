# Profiles are bundles of catalog tags. `ait install --profile NAME` installs
# every non-opt-in tool whose tags intersect the profile's tags.
# `all` is the union of web + api + mobile + code (plus core/runtime/cloud);
# `ai` is opt-in and never included by `all`. `vps` never selects GUI tools.
profiles:
  minimal: [core, runtime]
  mobile:  [core, runtime, mobile]
  web:     [core, runtime, recon, web, api, code, wordlists]
  api:     [core, runtime, api]
  code:    [core, runtime, code]
  vps:     [core, runtime, recon, wordlists]
  all:     [core, runtime, recon, web, api, code, mobile, cloud, wordlists]
  ai:      [ai]
