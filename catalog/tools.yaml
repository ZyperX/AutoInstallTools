# AutoInstallTools catalog — the single source of truth for every tool.
#
# Schema (per entry):
#   name        required  command/identifier (unique)
#   desc        required  <= 48 chars, shown in `ait list` and the menu
#   category    required  one of: core runtime recon proxy discovery vuln api
#                         js-secrets sast-sca android ios reversing wordlists
#                         cloud container ai   (the menu groups tools by this)
#   tags        required  list; profiles select tools by tag
#   method      required  apt | go | github_release | pipx | npm | cargo | git |
#                         git_venv | docker | official_archive | wget_mirror |
#                         runtime | manual
#   bin         optional  command used for the "installed?" check (default: name)
#   gui         optional  true for GUI apps (menu labels them on WSL)
#   check       optional  command run by `ait doctor` to confirm it works
#   opt_in      optional  true = never selected by a profile, only via --with
#   platforms   optional  list; default [linux]
#   notes       optional  free text
# Method-specific keys:
#   apt:[packages] | go:<module> | apt_deps:[packages] | repo:<owner/name> |
#   dest:<path> | pypi:<name> | npm:<name> | crate:<name> | git:<url> |
#   url:<mirror root> | runtime:<go|rust|node|awscli>
# Pinning fields (version/asset/sha256/checksum_file) are added in Phase 2.

tools:
  # ================= core / everyday CLI =================
