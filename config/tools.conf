# command|profile|required|check
# `check` is optional. When present it is run (split on spaces, never eval'd)
# to confirm the tool actually executes; when absent, only presence is checked.
bash|minimal|required|bash --version
git|minimal|required|git --version
curl|minimal|required|curl --version
rg|minimal|required|rg --version
jq|minimal|required|jq --version
yq|minimal|optional|yq --version
go|minimal|optional|go version
cargo|minimal|optional|cargo --version
node|minimal|optional|node --version
docker|full|optional|docker --version
nuclei|full|optional|nuclei -version
subfinder|full|optional|subfinder -version
httpx|full|optional|httpx -version
ffuf|full|optional|ffuf -V
feroxbuster|full|optional|feroxbuster --version
amass|full|optional|
frida|mobile|optional|frida --version
objection|mobile|optional|
adb|mobile|optional|adb version
apktool|mobile|optional|apktool --version
